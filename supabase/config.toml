# Local development stack: Postgres, sign-in service (Auth), data API and the mail catcher.
# Everything else is switched off on purpose (plan U1, infrastructure-specification.md).
# Reference: https://supabase.com/docs/guides/local-development/cli/config
project_id = "waldorf-community-task-manager"

[api]
enabled = true
port = 54321
# The default schema plus four worker schemas, so parallel test workers each use their own.
# Raising the worker limit means editing this list and the bootstrap migration.
schemas = ["public", "worker_1", "worker_2", "worker_3", "worker_4"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[api.tls]
enabled = false

[db]
port = 54322
shadow_port = 54320
health_timeout = "2m"
major_version = 17

[db.pooler]
enabled = false

[db.migrations]
enabled = false

[db.seed]
enabled = false

[realtime]
enabled = false

[studio]
enabled = false

[local_smtp]
enabled = true
port = 54324
smtp_port = 54325

[storage]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000/jelszo-visszaallitas/uj"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 8

password_requirements = "letters_digits"

# The password-verification hook (U2 owner decision, BR2.3): the sign-in service calls this database
# function for every password attempt, so five wrong passwords in 15 minutes lock the account for direct
# calls to the service too. The hook can name one schema; the default schema is wired (worker schemas hold
# the same function for tests of their own).
[auth.hook.password_verification_attempt]
enabled = true
uri = "pg-functions://postgres/public/password_verification_hook"

[auth.sessions]
inactivity_timeout = "720h"

[auth.rate_limit]
email_sent = 30
token_refresh = 30
sign_in_sign_ups = 30
token_verifications = 30

[auth.email]
# Stays true on purpose: in this CLI version this switch turns the whole email provider off (password
# sign-in and recovery then answer "Email logins are disabled"), not only open sign-up. Open sign-up
# is refused by `[auth] enable_signup = false` above; a test calls the sign-up endpoint (BR2.13).
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
max_frequency = "1m0s"
otp_expiry = 3600

[auth.email.template.recovery]
subject = "Jelszó-visszaállítás"
content_path = "./supabase/templates/recovery.html"

[edge_runtime]
enabled = false

[analytics]
enabled = false

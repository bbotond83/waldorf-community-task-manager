name: CI

# Sized for the free private-repository Actions minutes. A pull request runs the full check with Chromium only; the
# weekly and the manually started runs add Firefox and mobile Chrome. A push to main only records the build evidence:
# the squash-merged change was validated on its pull request. Changes that touch only AI-DLC workflow records
# (aidlc/, which no check reads) start no run, and a draft pull request is checked once it is ready for review.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "aidlc/**"
  push:
    branches: [main]
    paths-ignore:
      - "aidlc/**"
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # The event is part of the group, so a push to main never cancels the weekly full run on the same branch.
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    if: github.event_name != 'push' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      APP_HOST: 127.0.0.1
      # Pull requests browse with Chromium only; empty means every browser project (tests/browser/support/projects.ts).
      VERIFY_BROWSER_PROJECTS: ${{ github.event_name == 'pull_request' && 'chromium' || '' }}
      # Identity settings (names and local-only values; the session secret is generated below).
      APP_PUBLIC_URL: http://127.0.0.1:3000
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: "54325"
      SMTP_FROM: no-reply@example.test
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install browser dependencies
        run: npx playwright install --with-deps chromium firefox
      - name: Install PostgreSQL 18 tools without a service or default cluster
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          echo 'create_main_cluster = false' | sudo tee -a /etc/postgresql-common/createcluster.conf
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-18 postgresql-client-18
          echo '/usr/lib/postgresql/18/bin' >> "$GITHUB_PATH"
      # A fresh secret for every run: it keys the sign-in lockout and is never written to a file or printed.
      - name: Generate the session secret for this run
        run: |
          secret="$(openssl rand -hex 32)"
          echo "::add-mask::$secret"
          echo "APP_SESSION_SECRET=$secret" >> "$GITHUB_ENV"
      # The same command and configuration as on a developer machine (supabase/config.toml). The
      # container images are pulled on a cold runner, so the step has its own generous timeout; the
      # 90-second start target is reported only. The runner is an isolated VM, so publishing the
      # stack's ports on all interfaces is acknowledged here (see npm run db:start --help).
      - name: Start the local database stack
        timeout-minutes: 10
        env:
          DB_ALLOW_ALL_INTERFACES: "1"
        run: npm run db:start
      # The server-only admin module finds the sign-in service's admin key in the job environment (masked in the
      # log; the CLI's documented local default, not a secret of ours). Never printed. The build, the start smoke
      # and the browser phase find the stack's address and public key in the same place.
      - name: Expose the stack's settings to the job environment
        run: |
          status="$(npx supabase status -o env)"
          key="$(printf '%s\n' "$status" | sed -n 's/^SERVICE_ROLE_KEY="\(.*\)"$/\1/p')"
          anon="$(printf '%s\n' "$status" | sed -n 's/^ANON_KEY="\(.*\)"$/\1/p')"
          url="$(printf '%s\n' "$status" | sed -n 's/^API_URL="\(.*\)"$/\1/p')"
          test -n "$key"
          test -n "$anon"
          test -n "$url"
          echo "::add-mask::$key"
          echo "::add-mask::$anon"
          echo "SUPABASE_SERVICE_ROLE_KEY=$key" >> "$GITHUB_ENV"
          echo "SUPABASE_ANON_KEY=$anon" >> "$GITHUB_ENV"
          echo "SUPABASE_URL=$url" >> "$GITHUB_ENV"
      - name: Run the complete local verification pipeline
        run: npm run verify:local
      - name: Stop the local database stack
        if: always()
        run: npm run db:stop

  build_evidence:
    name: SBOM and build evidence
    # Only for the merged commit on main; its pull request ran the validate job.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # Build-only placeholders so this job's environment has the same setting names as the validate job and the
      # production build finds the database settings it requires. There is no service-role key here and no stack;
      # the session secret is generated below. The values are not secrets and point nowhere.
      APP_PUBLIC_URL: https://app.example.invalid
      SUPABASE_URL: https://app.example.invalid
      SUPABASE_ANON_KEY: build-only-placeholder-public-key
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: "54325"
      SMTP_FROM: no-reply@example.test
    steps:
      - name: Check out the validated commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Generate a build-only session secret
        run: |
          secret="$(openssl rand -hex 32)"
          echo "::add-mask::$secret"
          echo "APP_SESSION_SECRET=$secret" >> "$GITHUB_ENV"
      - name: Rebuild the validated commit
        run: npm run build
      - name: Generate CycloneDX SBOM
        run: npm sbom --sbom-format=cyclonedx --sbom-type=application > sbom.cdx.json
      - name: Archive the Next.js build
        run: tar -czf next-build.tar.gz --exclude=.next/cache .next
      - name: Record unsigned build metadata and checksums
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          const env = process.env;
          const metadata = {
            signed: false,
            repository: env.GITHUB_REPOSITORY,
            commit: env.GITHUB_SHA,
            ref: env.GITHUB_REF,
            event: env.GITHUB_EVENT_NAME,
            workflow: env.GITHUB_WORKFLOW,
            runId: env.GITHUB_RUN_ID,
            runAttempt: env.GITHUB_RUN_ATTEMPT,
            runUrl: `${env.GITHUB_SERVER_URL}/${env.GITHUB_REPOSITORY}/actions/runs/${env.GITHUB_RUN_ID}`,
            nodeVersion: process.version,
            createdAt: new Date().toISOString(),
          };
          writeFileSync('build-metadata.json', JSON.stringify(metadata, null, 2) + '\n');
          NODE
          sha256sum next-build.tar.gz sbom.cdx.json build-metadata.json > SHA256SUMS
      # Ordinary Actions artifacts; signed attestations are not set up.
      - name: Upload unsigned build evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            next-build.tar.gz
            sbom.cdx.json
            build-metadata.json
            SHA256SUMS
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

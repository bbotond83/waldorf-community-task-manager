name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      APP_RUNTIME_MODE: synthetic
      APP_SYNTHETIC_FIXTURE_VERSION: waldorf-local-v1
      APP_HOST: 127.0.0.1
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install browser dependencies
        run: npx playwright install --with-deps chromium firefox
      - name: Run the complete local verification pipeline
        run: npm run verify:local

  build_evidence:
    name: SBOM and build evidence
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      APP_RUNTIME_MODE: synthetic
      APP_SYNTHETIC_FIXTURE_VERSION: waldorf-local-v1
    steps:
      - name: Check out the validated commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Rebuild the validated commit
        run: npm run build
      - name: Generate CycloneDX SBOM
        run: npm sbom --sbom-format=cyclonedx --sbom-type=application > sbom.cdx.json
      - name: Archive the Next.js build
        run: tar -czf next-build.tar.gz --exclude=.next/cache .next
      - name: Record unsigned build metadata and checksums
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          const env = process.env;
          const metadata = {
            signed: false,
            repository: env.GITHUB_REPOSITORY,
            commit: env.GITHUB_SHA,
            ref: env.GITHUB_REF,
            event: env.GITHUB_EVENT_NAME,
            workflow: env.GITHUB_WORKFLOW,
            runId: env.GITHUB_RUN_ID,
            runAttempt: env.GITHUB_RUN_ATTEMPT,
            runUrl: `${env.GITHUB_SERVER_URL}/${env.GITHUB_REPOSITORY}/actions/runs/${env.GITHUB_RUN_ID}`,
            nodeVersion: process.version,
            runtimeMode: env.APP_RUNTIME_MODE,
            fixtureVersion: env.APP_SYNTHETIC_FIXTURE_VERSION,
            createdAt: new Date().toISOString(),
          };
          writeFileSync('build-metadata.json', JSON.stringify(metadata, null, 2) + '\n');
          NODE
          sha256sum next-build.tar.gz sbom.cdx.json build-metadata.json > SHA256SUMS
      # Ordinary private Actions artifacts do not require GitHub's attestation service.
      - name: Upload unsigned build evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            next-build.tar.gz
            sbom.cdx.json
            build-metadata.json
            SHA256SUMS
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
